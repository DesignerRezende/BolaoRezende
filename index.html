<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bolão Copa Rezende</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #F5F5DC; margin: 0; padding: 20px; }
     .container { max-width: 800px; margin: 0 auto; }
     .regras { background-color: #FFFFFF; padding: 20px; border-left: 5px solid #FEDF00; border-radius: 8px; margin-bottom: 20px; }
     .painel-jogo { background-color: #009B3A; color: white; padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
     .ranking { background-color: #FFFFFF; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        th { border-bottom: 2px solid #009B3A; }
     .top5 { background-color: #FFF8DC; font-weight: bold; }
     .botao { padding: 15px 30px; font-size: 18px; background-color: #FEDF00; color: #333; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
     .botao:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ATENÇÃO: COLOQUE SUA URL E SUA CHAVE DO SUPABASE AQUI DENTRO DAS ASPAS SIMPLES
        const SUPABASE_URL = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaHVwb2FnbGN3bWpja3R3eXltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MzU0NDQsImV4cCI6MjA5NDExMTQ0NH0.k1AoGE2sXsVCKEUm0Roc0Is8M27U8UpRRMzrdktoECY";
        const SUPABASE_KEY = "https://yahupoaglcwmjcktwyym.supabase.co/rest/v1/";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function BolaoApp() {
            const [match, setMatch] = React.useState(null);
            const = React.useState("Calculando tempo...");
            const [isLocked, setIsLocked] = React.useState(false);
            const [leaderboard, setLeaderboard] = React.useState();

            React.useEffect(() => {
                fetchNextMatch();
                fetchLeaderboard();
            },);

            async function fetchNextMatch() {
                try {
                    const { data, error } = await supabase
                     .from('matches')
                     .select('*')
                     .eq('status', 'pending')
                     .order('kickoff_time', { ascending: true })
                     .limit(1)
                     .single();
                    
                    if (data) {
                        setMatch(data);
                        startTimer(data.kickoff_time);
                    }
                } catch (err) {
                    console.log("Aguardando banco de dados...");
                }
            }

            async function fetchLeaderboard() {
                try {
                    const { data, error } = await supabase.rpc('get_rezende_leaderboard');
                    if (data) {
                        setLeaderboard(data);
                    }
                } catch (err) {
                    console.log("Aguardando banco de dados...");
                }
            }

            function startTimer(kickoffTimeStr) {
                const kickoffTime = new Date(kickoffTimeStr).getTime();
                const deadlineTime = kickoffTime - (2 * 60 * 60 * 1000); 

                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = deadlineTime - now;

                    if (distance <= 0) {
                        clearInterval(interval);
                        setTimeLeft("TEMPO ESGOTADO - PALPITES ENCERRADOS");
                        setIsLocked(true);
                    } else {
                        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                        setTimeLeft(`${days}d ${hours}h ${minutes}m ${seconds}s`);
                    }
                }, 1000);
            }

            return (
                <div className="container">
                    <div style={{ textAlign: 'center', color: '#333333' }}>
                        <h1>🏆 Bolão Copa Rezende</h1>
                    </div>

                    <div className="regras">
                        <h3 style={{ marginTop: 0 }}>📜 Regras e Pontuação</h3>
                        <p><b>5 Pontos:</b> Acertar o placar exato.</p>
                        <p><b>2 Pontos:</b> Acertar vencedor ou empate (errando o placar).</p>
                        <p><b>0 Pontos:</b> Errar o resultado.</p>
                        <hr />
                        <p><i>Atenção: Os 5 primeiros colocados recebem prêmios exclusivos da diretoria!</i></p>
                    </div>

                    {match? (
                        <div className="painel-jogo">
                            <h2>Próximo Jogo: Brasil x {match.opponent}</h2>
                            <h3 style={{ color: '#FEDF00' }}>⏱ Tempo restante: {timeLeft}</h3>
                            <button disabled={isLocked} className="botao">
                                ENVIAR MEU PALPITE
                            </button>
                            <p style={{marginTop: '10px', fontSize: '12px'}}>*O envio de palpites será integrado ao login do funcionário.</p>
                        </div>
                    ) : (
                        <div className="painel-jogo" style={{ backgroundColor: '#ccc', color: '#333' }}>
                            <h2>Nenhum jogo disponível no momento.</h2>
                        </div>
                    )}

                    <div className="ranking">
                        <h2>📊 Ranking Geral</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Posição</th>
                                    <th>Colaborador</th>
                                    <th>Pontos</th>
                                </tr>
                            </thead>
                            <tbody>
                                {leaderboard && leaderboard.length > 0? (
                                    leaderboard.map((user) => (
                                        <tr key={user.employee_name} className={user.rank <= 5? "top5" : ""}>
                                            <td>{user.rank}º</td>
                                            <td>{user.employee_name} {user.rank <= 5? "⭐" : ""}</td>
                                            <td>{user.total_points}</td>
                                        </tr>
                                    ))
                                ) : (
                                    <tr>
                                        <td colSpan="3" style={{textAlign: "center"}}>Nenhum ponto registrado ainda.</td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BolaoApp />);
    </script>
</body>
</html>
